name: Build BONK! Forge 26.3

on:
  push:
    paths:
      - 'forge-26.3/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'forge-26.3/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge-26.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Build mod
        run: gradle build --no-daemon --stacktrace
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: BONK-1.0.0-forge-26.3
          path: forge-26.3/build/libs/*.jar
          if-no-files-found: error
